name: iOS CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: Build and test on iPhone Simulator
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone Simulator
        id: simulator
        shell: bash
        run: |
          simulator_udid="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$simulator_udid"
          echo "udid=$simulator_udid" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: >-
          xcodebuild test -project SportNutritionApp.xcodeproj -scheme SportNutritionApp
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' CODE_SIGNING_ALLOWED=NO
