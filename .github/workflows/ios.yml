name: iOS CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: Build and test on iPhone Simulator
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iPhone Simulator
        id: simulator
        shell: bash
        run: |
          simulator_udid="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$simulator_udid"
          echo "udid=$simulator_udid" >> "$GITHUB_OUTPUT"
      - name: Start iPhone Simulator
        run: |
          xcrun simctl boot "${{ steps.simulator.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b
      - name: Build and test while recording simulator video
        id: video
        shell: bash
        run: |
          video_path="$RUNNER_TEMP/workout-flow.mp4"
          echo "path=$video_path" >> "$GITHUB_OUTPUT"
          xcrun simctl io "${{ steps.simulator.outputs.udid }}" recordVideo --codec=h264 --force "$video_path" >"$RUNNER_TEMP/workout-flow-recording.log" 2>&1 &
          video_pid=$!
          stop_recording() {
            kill -INT "$video_pid" 2>/dev/null || true
            wait "$video_pid" || true
          }
          trap stop_recording EXIT INT TERM
          xcodebuild test -project SportNutritionApp.xcodeproj -scheme SportNutritionApp \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath "$RUNNER_TEMP/SportNutritionAppDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/SportNutritionApp.xcresult" \
            CODE_SIGNING_ALLOWED=NO INFOPLIST_KEY_CFBundleDevelopmentRegion=fr
      - name: Export UI test screenshots
        id: screenshot
        run: |
          screenshots_path="$RUNNER_TEMP/workout-ui-screenshots"
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/SportNutritionApp.xcresult" \
            --output-path "$screenshots_path"
          manifest_path="$screenshots_path/manifest.json"
          jq -r '.[].attachments[] | [.exportedFileName, .suggestedHumanReadableName] | @tsv' "$manifest_path" | while IFS=$'\t' read -r exported_file_name suggested_name; do
            capture_name="${suggested_name%%_0_*}.png"
            mv "$screenshots_path/$exported_file_name" "$screenshots_path/$capture_name"
          done
          test -n "$(find "$screenshots_path" -name '*.png' -print -quit)"
          echo "path=$screenshots_path" >> "$GITHUB_OUTPUT"
      - name: Upload iPhone Simulator screenshots
        uses: actions/upload-artifact@v4
        with:
          name: iphone-simulator-workout-screenshots
          path: ${{ steps.screenshot.outputs.path }}
          if-no-files-found: error
      - name: Upload iPhone Simulator workout video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-simulator-workout-video
          path: ${{ steps.video.outputs.path }}
          if-no-files-found: error
